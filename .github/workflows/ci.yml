name: SentinelX Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust Quality & Security (Windows 11)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies & Build
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify Rust Formatting
        run: cargo fmt --all -- --check

      - name: Strict Clippy Linter (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Execute Full Workspace Test Suite
        run: cargo test --workspace

      - name: Compile Workspace Binaries
        run: cargo build --workspace

  frontend-quality:
    name: Frontend Quality & Tests (Node.js)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js Runtime
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Clean Dependency Installation from Lockfile
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npm run typecheck

      - name: Oxlint Static Quality Analysis
        run: npm run lint

      - name: Vitest Automated Frontend Tests
        run: npm test

      - name: Production Frontend Bundle Build
        run: npm run build

      - name: npm Dependency Security Audit
        run: npm audit --audit-level=high

  desktop-packaging:
    name: Desktop Packaging Validation (NSIS Bundle)
    needs: [rust-quality, frontend-quality]
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js Runtime
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ui
        run: npm ci

      - name: Build Tauri Desktop Package & NSIS Installer
        run: npx --prefix ui tauri build --bundles nsis

      - name: Compute Artifact SHA-256 Checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path target/release/bundle/nsis -Filter "SentinelX_*_x64-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced." }
          $hash = Get-FileHash -Path $installer.FullName -Algorithm SHA256
          Write-Host "CI Built Installer: $($installer.Name)"
          Write-Host "SHA256: $($hash.Hash)"
          "$($hash.Hash)  $($installer.Name)" | Out-File -FilePath target/release/bundle/nsis/SHA256SUMS.txt -Encoding utf8

      - name: Upload Verification Artifacts (Non-Public)
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba811e # v4.6.1
        with:
          name: SentinelX-CI-Build-Artifacts
          path: |
            target/release/bundle/nsis/SentinelX_*_x64-setup.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          retention-days: 7
