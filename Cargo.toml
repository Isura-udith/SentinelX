[workspace]
resolver = "2"
members = [
    "crates/sentinel-core",
    "crates/sentinel-detection",
    "crates/sentinel-collector",
    "crates/sentinel-app",
    "crates/sentinel-storage",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
authors = ["SentinelX Contributors"]
license = "MIT"
repository = "https://github.com/sentinelx/sentinelx"
rust-version = "1.85"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time & Identity
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Asynchronous Runtime
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }

# Database & Persistence
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "tls-none", "chrono", "uuid", "migrate", "macros"] }

# Property-Based & Integration Testing
proptest = "1.6"
tempfile = "3.17"

# Workspace Members
sentinel-core = { path = "crates/sentinel-core" }
sentinel-detection = { path = "crates/sentinel-detection" }
sentinel-collector = { path = "crates/sentinel-collector" }
sentinel-storage = { path = "crates/sentinel-storage" }

# Windows API
windows-sys = { version = "0.61.2", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
field_reassign_with_default = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
cast_ptr_alignment = "allow"
assert_is_empty = "allow"
